name: Validate n8n workflow exports

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild workflow exports
        run: npm run build

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Validate workflow structure and security
        run: npm test
